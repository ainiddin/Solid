<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>inVision U — Candidate Screening</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f13;
      color: #e2e2e2;
      min-height: 100vh
    }

    nav {
      background: #1a1a24;
      padding: 14px 28px;
      display: flex;
      gap: 20px;
      align-items: center;
      border-bottom: 1px solid #2d2d3a
    }

    nav a {
      color: #7c6ff7;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px
    }

    nav span {
      font-weight: 800;
      color: #fff;
      font-size: 17px;
      margin-right: auto
    }

    .page {
      display: none;
      padding: 32px 24px;
      max-width: 980px;
      margin: 0 auto
    }

    .page.active {
      display: block
    }

    h2 {
      font-size: 22px;
      margin-bottom: 20px;
      color: #fff
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: #aaa
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      background: #1e1e2e;
      border: 1px solid #2d2d3a;
      border-radius: 8px;
      color: #e2e2e2;
      font-size: 14px;
      margin-bottom: 14px
    }

    textarea {
      min-height: 100px;
      resize: vertical
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px
    }

    .btn-primary {
      background: #7c6ff7;
      color: #fff
    }

    .btn-success {
      background: #22c55e;
      color: #fff
    }

    .btn-danger {
      background: #ef4444;
      color: #fff
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 13px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px
    }

    th {
      text-align: left;
      padding: 10px 12px;
      background: #1e1e2e;
      color: #aaa;
      font-size: 13px;
      border-bottom: 1px solid #2d2d3a
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #1e1e2e;
      font-size: 14px;
      vertical-align: top
    }

    tr:hover td {
      background: #1a1a28
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700
    }

    .badge-low {
      background: #16a34a22;
      color: #22c55e;
      border: 1px solid #22c55e44
    }

    .badge-medium {
      background: #d9780622;
      color: #f59e0b;
      border: 1px solid #f59e0b44
    }

    .badge-high {
      background: #dc262622;
      color: #ef4444;
      border: 1px solid #ef4444aa
    }

    .card {
      background: #1a1a24;
      border: 1px solid #2d2d3a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px
    }

    .dim-block {
      background: #13131d;
      border: 1px solid #2d2d3a;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px
    }

    .dim-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px
    }

    .dim-label {
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      width: 120px
    }

    .bar-bg {
      flex: 1;
      height: 8px;
      background: #2d2d3a;
      border-radius: 4px
    }

    .bar-fill {
      height: 8px;
      background: #7c6ff7;
      border-radius: 4px;
      transition: width .6s
    }

    .score-num {
      font-weight: 800;
      font-size: 16px;
      color: #7c6ff7;
      min-width: 50px;
      text-align: right
    }

    .dim-reason {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 8px;
      line-height: 1.5
    }

    .dim-evidence {
      font-size: 12px;
      color: #888;
      background: #0f0f18;
      border-left: 3px solid #7c6ff7;
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 8px;
      font-style: italic
    }

    .dim-improve {
      font-size: 12px;
      color: #f59e0b;
      margin-top: 6px
    }

    .chip {
      display: inline-block;
      background: #2d2d3a;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      margin: 3px
    }

    .chip-green {
      background: #16a34a22;
      color: #22c55e;
      border: 1px solid #22c55e33
    }

    .chip-red {
      background: #dc262622;
      color: #ef4444;
      border: 1px solid #ef444433
    }

    .notice {
      background: #7c6ff722;
      border: 1px solid #7c6ff755;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      margin-top: 16px;
      color: #c4bdff
    }

    .logic-box {
      background: #1a1a24;
      border: 1px solid #7c6ff744;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px
    }

    .committee-box {
      background: #1a241a;
      border: 1px solid #22c55e44;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    .logic-text {
      font-size: 13px;
      color: #c4bdff;
      line-height: 1.6
    }

    .committee-text {
      font-size: 13px;
      color: #86efac;
      line-height: 1.6
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #7c6ff7;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      z-index: 99
    }

    .score-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border: 3px solid #7c6ff7;
      background: #13131d
    }

    .score-big {
      font-size: 26px;
      font-weight: 800;
      color: #7c6ff7;
      line-height: 1
    }

    .score-sub {
      font-size: 11px;
      color: #555
    }

    @media(max-width:600px) {
      .row2 {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>
  <nav>
    <span>⬡ inVision U</span>
    <a href="#apply">Apply</a>
    <a href="#dashboard">Dashboard</a>
  </nav>

  <!-- APPLY -->
  <div class="page" id="page-apply">
    <h2>📋 Candidate Application</h2>
    <div class="row2">
      <div>
        <label>Full Name</label>
        <input id="f-name" placeholder="Aisha Bekova" />
        <label>Age</label>
        <input id="f-age" type="number" placeholder="18" />
        <label>City</label>
        <input id="f-city" placeholder="Almaty" />
        <label>School / University</label>
        <input id="f-school" placeholder="NIS Almaty" />
      </div>
      <div>
        <label>GPA</label>
        <input id="f-gpa" type="number" step="0.01" placeholder="3.8" />
        <label>Achievements</label>
        <textarea id="f-achievements" placeholder="Olympiad wins, projects, clubs…"></textarea>
      </div>
    </div>
    <label>Essay — Who are you and why inVision U?</label>
    <textarea id="f-essay" style="min-height:130px" placeholder="Write in your own words…"></textarea>
    <label>Motivation & Goals</label>
    <textarea id="f-motivation" placeholder="What impact do you want to make?"></textarea>
    <button class="btn btn-primary" onclick="submitApplication()">🚀 Submit Application</button>
  </div>

  <!-- DASHBOARD -->
  <div class="page" id="page-dashboard">
    <h2>📊 Admissions Dashboard</h2>
    <button class="btn btn-primary btn-sm" onclick="loadDashboard()" style="margin-bottom:14px">↻ Refresh</button>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>City</th>
          <th>Score</th>
          <th>AI Flag</th>
          <th>Recommendation</th>
          <th>Why (summary)</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="dashboard-body"></tbody>
    </table>
  </div>

  <!-- CANDIDATE CARD -->
  <div class="page" id="page-candidate">
    <button class="btn btn-sm" onclick="location.hash='#dashboard'"
      style="margin-bottom:16px;background:#2d2d3a;color:#aaa">← Back</button>
    <div id="candidate-detail"></div>
  </div>

  <div id="toast"></div>

  <script>
    const API = "https://ainiddin.pythonanywhere.com";

    function toast(msg, ok = true) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.style.background = ok ? "#7c6ff7" : "#ef4444";
      t.style.display = "block"; setTimeout(() => t.style.display = "none", 3500);
    }

    function route() {
      const h = location.hash || "#apply";
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      if (h.startsWith("#candidate/")) {
        document.getElementById("page-candidate").classList.add("active");
        loadCandidate(h.split("/")[1]);
      } else if (h === "#dashboard") {
        document.getElementById("page-dashboard").classList.add("active");
        loadDashboard();
      } else {
        document.getElementById("page-apply").classList.add("active");
      }
    }
    window.addEventListener("hashchange", route);
    route();

    async function submitApplication() {
      const body = {
        name: document.getElementById("f-name").value,
        age: parseInt(document.getElementById("f-age").value),
        city: document.getElementById("f-city").value,
        school: document.getElementById("f-school").value,
        gpa: parseFloat(document.getElementById("f-gpa").value),
        achievements: document.getElementById("f-achievements").value,
        essay: document.getElementById("f-essay").value,
        motivation: document.getElementById("f-motivation").value
      };
      if (!body.name || !body.age || !body.city || !body.school || !body.gpa || !body.essay) {
        toast("Please fill all required fields", false); return;
      }
      const r = await fetch(`${API}/candidates`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (r.ok) { toast("Application submitted! ✓"); location.hash = "#dashboard"; }
      else toast("Error submitting", false);
    }

    async function loadDashboard() {
      const r = await fetch(`${API}/candidates`);
      const rows = await r.json();
      const sorted = [...rows].sort((a, b) => (b.total_score || 0) - (a.total_score || 0));
      document.getElementById("dashboard-body").innerHTML = sorted.map(c => `
    <tr>
      <td>${c.id}</td>
      <td><a href="#candidate/${c.id}" style="color:#7c6ff7;text-decoration:none;font-weight:600">${c.name}</a></td>
      <td>${c.city}</td>
      <td><b style="font-size:16px">${c.total_score != null ? c.total_score : "—"}</b></td>
      <td>${c.ai_text_flag ? aiBadge(c.ai_text_flag) : "—"}</td>
      <td style="font-size:12px;max-width:180px">${c.recommendation || "—"}</td>
      <td style="font-size:11px;color:#888;max-width:300px;white-space:normal;line-height:1.5">${c.scoring_logic || "—"}</td>
      <td style="font-size:12px;color:#aaa">${c.status || "pending"}</td>
      <td><button class="btn btn-primary btn-sm" onclick="runScore(${c.id})">⚡ Score</button></td>
    </tr>`).join("");
    }

    function aiBadge(flag) {
      const cls = { Low: "low", Medium: "medium", High: "high" }[flag] || "medium";
      return `<span class="badge badge-${cls}">${flag}</span>`;
    }

    async function runScore(id) {
      toast("Running AI scoring…");
      const r = await fetch(`${API}/score/${id}`, { method: "POST" });
      if (r.ok) { toast("Scored! ✓"); loadDashboard(); }
      else toast("Scoring failed", false);
    }

    async function loadCandidate(id) {
      const r = await fetch(`${API}/candidate/${id}`);
      if (!r.ok) { document.getElementById("candidate-detail").innerHTML = "Not found"; return; }
      const c = await r.json();
      const s = c.score_data;
      const el = document.getElementById("candidate-detail");

      if (!s) {
        el.innerHTML = `<div class="card">
      <h2>${c.name}</h2>
      <p style="color:#aaa;margin-top:12px">Not scored yet.</p>
      <button class="btn btn-primary" style="margin-top:14px" onclick="runScore(${c.id})">⚡ Run AI Score</button>
    </div>`;
        return;
      }

      const dims = s.dimensions || {};
      const maxMap = { skills: 25, motivation: 25, leadership: 30, growth: 20 };
      const dimIcons = { skills: "🎓", motivation: "💡", leadership: "🚀", growth: "📈" };

      el.innerHTML = `
    <!-- HEADER -->
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
      <div>
        <h2>${c.name}</h2>
        <p style="color:#aaa;font-size:13px;margin-top:4px">${c.age}y · ${c.city} · ${c.school} · GPA ${c.gpa}</p>
        <p style="margin-top:10px;font-size:14px;color:#c4bdff;font-weight:600">${s.recommendation}</p>
      </div>
      <div class="score-circle">
        <div class="score-big">${s.total_score}</div>
        <div class="score-sub">/ 100</div>
      </div>
    </div>

    <!-- SCORING LOGIC (WHY) -->
    <div class="logic-box">
      <div style="font-size:12px;color:#7c6ff7;font-weight:700;margin-bottom:8px">🧠 WHY THIS SCORE — Overall Reasoning</div>
      <div class="logic-text">${s.scoring_logic || "—"}</div>
    </div>

    <!-- DIMENSIONS -->
    <div class="card">
      <h3 style="margin-bottom:14px;font-size:15px">📊 Dimension Breakdown</h3>
      ${Object.entries(dims).map(([k, v]) => `
        <div class="dim-block">
          <div class="dim-header">
            <div class="dim-label">${dimIcons[k] || ""} ${k.charAt(0).toUpperCase() + k.slice(1)}</div>
            <div class="bar-bg"><div class="bar-fill" style="width:${(v.score / maxMap[k]) * 100}%"></div></div>
            <div class="score-num">${v.score}<span style="color:#444;font-size:11px">/${maxMap[k]}</span></div>
          </div>
          <div class="dim-reason">${v.reason}</div>
          <div class="dim-evidence">📌 Evidence: "${v.evidence || "—"}"</div>
          <div class="dim-improve">💬 What would improve this score: ${v.what_would_improve || "—"}</div>
        </div>
      `).join("")}
    </div>

    <!-- STRENGTHS & RISKS -->
    <div class="row2">
      <div class="card">
        <h3 style="margin-bottom:10px;font-size:14px">✅ Key Strengths</h3>
        ${(s.key_strengths || []).map(x => `<div class="chip chip-green" style="display:block;margin-bottom:6px;border-radius:6px">${x}</div>`).join("")}
      </div>
      <div class="card">
        <h3 style="margin-bottom:10px;font-size:14px">⚠️ Risks</h3>
        ${(s.risks || []).map(x => `<div class="chip chip-red" style="display:block;margin-bottom:6px;border-radius:6px">${x}</div>`).join("")}
      </div>
    </div>

    <!-- COMMITTEE QUESTIONS -->
    <div class="committee-box">
      <div style="font-size:12px;color:#22c55e;font-weight:700;margin-bottom:8px">🎤 Suggested Interview Questions for Committee</div>
      <div class="committee-text">${s.committee_notes || "—"}</div>
    </div>

    <!-- AI FLAG -->
    <div class="card">
      <h3 style="margin-bottom:10px;font-size:14px">🤖 AI Text Detection</h3>
      <p>${aiBadge(s.ai_text_flag)} &nbsp;<span style="font-size:13px;color:#888">${s.ai_flag_reason || ""}</span></p>
    </div>

    <div class="notice">⚠️ ${s.human_in_the_loop || "This score is advisory only. Final decisions must be made by the admissions committee."}</div>

    <div style="display:flex;gap:12px;margin-top:20px">
      <button class="btn btn-success" onclick="setStatus(${c.id},'shortlisted')">✓ Shortlist</button>
      <button class="btn btn-danger" onclick="setStatus(${c.id},'rejected')">✗ Reject</button>
    </div>
  `;
    }

    async function setStatus(id, status) {
      const r = await fetch(`${API}/candidate/${id}/status?status=${status}`, { method: "PATCH" });
      if (r.ok) toast(`Status set: ${status}`);
    }
  </script>
</body>

</html>
